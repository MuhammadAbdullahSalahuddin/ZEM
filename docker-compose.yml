services:
  zem:
    build: .
    image: zem:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      ZEM_REASONER: ${ZEM_REASONER:-mock}
      ZEM_ENRICHER: ${ZEM_ENRICHER:-mock}
      ZEM_DB: /data/zem.db
    volumes:
      - zem-data:/data

volumes:
  zem-data:
