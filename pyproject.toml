[project]
name = "zem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MuhammadAbdullahSalahuddin", email = "220325808+MuhammadAbdullahSalahuddin@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bashlex>=0.18",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp<2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlmodel>=0.0.48",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
zem = "zem.cli.main:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
